services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_db1}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_drone}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: emqx/emqx:5.7
    restart: always
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "18083:18083"
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: 127.0.0.1
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin_db1}@postgres:5432/${POSTGRES_DB:-sentinel_drone}?schema=public
      - MONGO_URL=mongodb://mongodb:27017/sentinel_telemetry
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
      - MQTT_BROKER=mqtt://mqtt:1883
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mqtt:
        condition: service_started
    volumes:
      - ./backend/logs:/app/logs

volumes:
  postgres_data:
  mongo_data:
  emqx_data:
  emqx_log:
